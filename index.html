<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMPUS_OBSERVATION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="overlay"></div>

    <main class="terminal-container">
        <header class="terminal-header">
            <div class="status-bar">
                <span>SYSTEM_STATUS: ONLINE</span>
                <span class="blink">●</span>
            </div>
            <h1 class="glitch" data-text="CAMPUS_OBSERVATION">CAMPUS_OBSERVATION</h1>
            <p class="typing-text">> Monitoramento CPD Fatec... Identificando anomalias.</p>
        </header>

        <nav class="menu-options">
            <button id="iniciar"><span class="prompt">[</span> 01. INICIAR_SESSAO <span class="prompt">]</span></button>
            <button id="instrucoes"><span class="prompt">[</span> 02. ACESSAR_INSTRUCOES <span
                    class="prompt">]</span></button>
            <button id="configuracoes"><span class="prompt">[</span> 03. CONFIGURACOES <span
                    class="prompt">]</span></button>
            <button id="creditos"><span class="prompt">[</span> 04. ACESSAR_CREDITOS <span
                    class="prompt">]</span></button>
        </nav>

        <footer class="terminal-footer">
            <p>V0.8.2-BETA | CONNECTION: ENCRYPTED</p>
        </footer>
    </main>

    <script src="./js/script.js"></script>
</body>

</html>
