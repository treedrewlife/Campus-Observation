<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA COMPROMETIDO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .error-text {
            color: #ff003c;
            text-shadow: 0 0 10px #ff003c;
            margin: 20px 0;
            font-size: 1.2rem;
        }

        .btn-voltar {
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="overlay"></div>

    <main class="terminal-container"
        style="border-color: #ff003c; box-shadow: 0 0 20px rgba(255, 0, 60, 0.2), inset 0 0 10px rgba(255, 0, 60, 0.1);">
        <header class="terminal-header">
            <div class="status-bar" style="color: #ff003c;">
                <span>SYSTEM_STATUS: CRITICAL_FAILURE</span>
                <span class="blink">●</span>
            </div>
            <h1 class="glitch" data-text="GAME_OVER" style="color: #ff003c;">GAME_OVER</h1>
            <p class="error-text">> ERRO_FATAL: Limite de anomalias excedido.</p>
            <p class="error-text">> O monitoramento foi comprometido e o campus não é mais seguro.</p>
        </header>

        <nav class="menu-options">
            <a href="../index.html" class="btn-voltar">
                <button type="button"><span class="prompt">[</span> 01. REINICIAR_SISTEMA <span
                        class="prompt">]</span></button>
            </a>
        </nav>

        <footer class="terminal-footer" style="color: #ff003c;">
            <p>V0.8.2-BETA | CONNECTION: LOST</p>
        </footer>
    </main>
</body>

</html>
