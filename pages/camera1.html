<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAM_01 - Lab105</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/cameras.css">
</head>

<body class="camera-view">
    <div class="overlay-video"></div>

    <main class="monitor-container">
        <header class="cam-header">
            <div class="status-bar">
                <span id="feed-status">FEED_ESTÁVEL</span>
                <span class="blink">●</span>
            </div>
            <div id="relogio-digital">00:00 AM</div>
        </header>

        <div class="camera-display" id="camera-container">
            <div class="cam-info">CAM 01 - LAB105</div>

            <div><button id="btn-consertar"> CONSERTAR CÂMERA </button></div>

            <img src="../assets/images/cameras/camera1.webp" id="feed-camera" alt="Monitoramento">
        </div>

        <nav class="controles-camera">
            <button class="btn-nav active">01</button>
            <button onclick="location.href='../pages/camera2.html'" class="btn-nav">02</button>
            <button onclick="location.href='../pages/camera3.html'" class="btn-nav">03</button>
            <button onclick="location.href='../pages/camera4.html'" class="btn-nav">04</button>
            <button onclick="location.href='../pages/camera5.html'" class="btn-nav">05</button>
            <button onclick="location.href='../pages/camera6.html'" class="btn-nav">06</button>
        </nav>

        <div id="minimap-container"></div>
    </main>

    <script src="../js/gameLogic.js"></script>
</body>

</html>
