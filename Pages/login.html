<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA CPD - ACESSO RESTRITO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <div class="scanline"></div>
    <div class="overlay"></div>

    <main class="login-box">
        <header class="login-header">
            <div class="status-bar">
                <h3>ACESSO_CPD</h3>
                <span class="blink">●</span>
            </div>

        </header>

        <form id="login-form">
            <div class="form-group">
                <label for="username">&gt; USUÁRIO / ID DE SEGURANÇA:</label>
                <input type="text" id="username" autocomplete="off" placeholder="USUÁRIO">
            </div>

            <div class="form-group">
                <label for="password">&gt; SENHA DE ACESSO:</label>
                <input type="password" id="password" maxlength="8" autocomplete="off" placeholder="••••">
            </div>

            <div id="error-msg"></div>

            <nav class="login-footer">
                <button type="button" id="btn-voltar">
                    [ RETORNAR ]
                </button>

                <button type="submit">
                    [ ACESSAR ]
                </button>
            </nav>
        </form>
    </main>

    <script src="../js/login.js"></script>
</body>
</html>
