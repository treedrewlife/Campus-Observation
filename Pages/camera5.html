<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAM_05 - ESCADA-2 </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="../css/cameras.css">

<body class="camera-view">
    <div class="overlay-video"></div>

    <main class="monitor-container">
        <header class="cam-header">
            <div class="status-bar">
                <span id="status-conexao">CONEXÃO_ESTÁVEL</span>
                <span class="blink">●</span>
            </div>
            <div id="timer">00:00 AM</div>
        </header>

        <div class="camera-display" id="camera-container">
            <div class="cam-info">CAM 05 - ESCADA_2</div>

           

            <img src="../assets/imagem/camera/camera5.webp" id="feed-camera" alt="Monitoramento">

            
        </div>

         

        <nav class="controles-camera">
            <button onclick="location.href='camera1.html'" class="btn-nav">01</button>
            <button onclick="location.href='camera2.html'" class="btn-nav">02</button>
            <button onclick="location.href='camera3.html'" class="btn-nav">03</button>
            <button onclick="location.href='camera4.html'" class="btn-nav">04</button> 
            <button class="btn-nav active">05</button>
            <button onclick="location.href='camera6.html'" class="btn-nav">06</button>
            <div><button id="btn-reportar"> DETECTAR ANOMALIA </button></div>
        </nav>
    </main>
    
    <script>window.CAM_ID = "camera5";</script>
    <script src="../js/game.js"></script>

</body>
</html>
