<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Credits</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">

    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
        }

        .credits-container {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 1.5s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glitch {
            animation: glitch 0.25s 3;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-1px, 1px); }
            80% { transform: translate(1px, -1px); }
            100% { transform: translate(0); }
        }

        .credits-box {
            max-height: 60vh;
            overflow: hidden;
            padding: 20px;
            border-left: 2px solid rgba(0,255,100,0.3);
        }

        .line {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .line.show {
            opacity: 1;
            transform: translateY(0);
        }

        .indent {
            margin-left: 20px;
            color: #9affb0;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .scanline {
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0,255,100,0.05) 50%,
                transparent 100%
            );
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
    </style>
</head>

<body>

<div class="scanline"></div>
<div class="overlay"></div>

<main class="terminal-container credits-container">

    <header class="terminal-header">

        <div class="status-bar">
            <span>> SYSTEM_STATUS: <span class="blink">FINALIZING</span></span>
            <span id="clock"></span>
        </div>

        <h1 class="title-clean glitch" id="title">
            SYSTEM_CREDITS
        </h1>

        <p class="typing-text" id="subtitle"></p>

    </header>

    <section class="credits-box" id="credits">

       

    </section>

    <footer class="terminal-footer">
        <p>SESSION TERMINATED | DATA ARCHIVED | BUILD 0.8.2-BETA</p>
    </footer>

</main>

<script>
   
    function updateClock() {
        const now = new Date();
        document.getElementById("clock").textContent =
            "> TIME: " + now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    }
    setInterval(updateClock, 1000);
    updateClock();

    
    const subtitle = "> Compilando memória do sistema...";
    let i = 0;

    function typeSubtitle() {
        if (i < subtitle.length) {
            document.getElementById("subtitle").textContent += subtitle[i];
            i++;
            setTimeout(typeSubtitle, 30);
        } else {
            startCredits();
        }
    }

    
    const creditsData = [
        "> EXECUTIVE_PRODUCTION:",
        "Campus Observation Project",

        "> DEVELOPMENT:",
        "Seu Nome / Equipe",

        "> GAME_DESIGN:",
        "Seu Nome",

        "> PROGRAMMING:",
        "Seu Nome",

        "> VISUAL_INTERFACE:",
        "Terminal UI System",

        "> SPECIAL_THANKS:",
        "FATEC / Testadores / Inspiração",

        "> SYSTEM_STATUS:",
        "FINALIZED ✔"
    ];

    const creditsBox = document.getElementById("credits");

    let index = 0;

    function showNextLine() {
        if (index >= creditsData.length) {
            document.getElementById("title").classList.add("glitch");
            return;
        }

        const line = document.createElement("div");
        line.classList.add("line");

        const text = creditsData[index];
        line.textContent = text;

        creditsBox.appendChild(line);

        setTimeout(() => line.classList.add("show"), 50);

        index++;

       
        creditsBox.scrollTop = creditsBox.scrollHeight;

        setTimeout(showNextLine, 600);
    }

    function startCredits() {
        showNextLine();
        returnToMenuAfterDelay() 
    }

   
    window.onload = () => {
        document.body.classList.add("glitch");
        setTimeout(() => document.body.classList.remove("glitch"), 600);

        setTimeout(typeSubtitle, 500);
    };

    function returnToMenuAfterDelay() {
    setTimeout(() => {
        localStorage.clear();

        window.location.href = "/index.html";
    }, 10000); 
}

</script>

</body>
</html>
